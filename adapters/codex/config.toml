# Codex project-level config for PM Agent MVP (read-only sources + local drafts).
# Codex loads .codex/config.toml only for TRUSTED projects (projects.<path>.trust_level = "trusted" in ~/.codex/config.toml).
# Verified against learn.chatgpt.com/docs/config-file/config-reference on 2026-11-01.
# This file is the canonical copy; .codex/config.toml is generated by kit-cli.py sync --write.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

# MCP servers: intentionally NONE configured. MVP exposes no write capability.
# When Tom adds a read-only connector, allowlist read tools explicitly, e.g.:
# [mcp_servers.asana]
# url = "<server url>"
# enabled_tools = ["get_task", "get_tasks", "search_tasks", "get_project", "get_task_stories"]
# disabled_tools = ["create_tasks", "update_tasks", "add_comment", "delete_task"]
